name: Validate generated dataset

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and run local validation
        run: python3 generate.py
      - name: Verify committed output is current
        run: git diff --check && git diff --exit-code
